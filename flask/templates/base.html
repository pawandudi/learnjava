<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %}My feedback site{% endblock %}</title>
    <style> body { font-family: Arial, Helvetica, sans-serif; padding: 20px; background-color: #f5f5f5; }
        header, footer { background-color: #333; padding: 10px; color: white; text-align: center; }
        nav a { color: white; text-decoration: none; margin: 0 10px; }
        main { background-color: white; padding: 20px; margin-top: 20px; border-radius: 5px;}
    </style>
</head>
<body>
    <header>
        <h1>My Feedback Site</h1>
        <nav>
            <a href="/feedback">Feedback</a> |
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        &copy; 2024 My Feedback Site
    </footer>
</body>
</html>
